name: ci
on:
  push: {branches: [main]}
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.14"}
      - name: Install (CPU torch; docling is only needed by the ingestion worker)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1
          grep -v -E '^(torch|docling)==' requirements.txt > /tmp/req.txt
          pip install -r /tmp/req.txt
      - name: Unit tests (no live services; integration tests skip themselves)
        run: python -m unittest discover -s tests -t . -v
