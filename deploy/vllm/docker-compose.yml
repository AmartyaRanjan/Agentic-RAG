# Private vLLM inference service. Usage: see INFERENCE_LOG.md ("Commands").
services:
  vllm:
    image: vllm/vllm-openai:v0.31.0          # pinned; tested on L4 (see INFERENCE_LOG.md)
    container_name: rag-vllm
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      HF_HOME: /hf
      HF_HUB_OFFLINE: "1"        # model must be pre-downloaded into HF_CACHE_DIR (see log)
    volumes:
      - ${HF_CACHE_DIR:-~/.cache/huggingface}:/hf
      - vllm_cache:/root/.cache/vllm            # torch.compile cache: faster restarts
    ports:
      - "127.0.0.1:${VLLM_PORT:-8001}:8000"   # loopback only; /metrics is NOT api-key protected
    ipc: host
    command:
      - ${INFERENCE_MODEL:-Qwen/Qwen3-4B-FP8}
      - --revision=${INFERENCE_REVISION:-96b30dc13593a244a5e59e84687309f53c375cfa}
      - --served-model-name=${INFERENCE_MODEL:-Qwen/Qwen3-4B-FP8}
      - --api-key=${INFERENCE_API_KEY:?set INFERENCE_API_KEY}
      - --max-model-len=${VLLM_MAX_MODEL_LEN:-8192}
      - --gpu-memory-utilization=${VLLM_GPU_UTIL:-0.30}
      - --kv-cache-memory-bytes=${VLLM_KV_CACHE_BYTES:-1610612736}   # fixed 1.5 GiB: profiling-based sizing breaks when other GPU tenants allocate during startup
      - --max-num-seqs=${VLLM_MAX_NUM_SEQS:-2}
      - --enable-prefix-caching
      - --reasoning-parser=qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser=hermes
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s
    restart: unless-stopped
    stop_grace_period: 60s

volumes:
  vllm_cache:
